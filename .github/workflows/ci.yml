name: Container checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint, typecheck, test and build in Node container
        run: docker compose --profile test run --rm frontend-test
      - name: Clean project containers
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Java verify against isolated MySQL
        run: docker compose --profile test run --rm backend-test
      - name: Clean project containers
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
