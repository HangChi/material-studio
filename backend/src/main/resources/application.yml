spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/material_studio?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DATABASE_USER:studio}
    password: ${DATABASE_PASSWORD:local-demo-password}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
  flyway:
    enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  tomcat:
    max-swallow-size: 6MB
  error:
    include-message: never
    include-stacktrace: never

studio:
  max-pending: ${STUDIO_MAX_PENDING:100}
  max-pending-per-user: ${STUDIO_MAX_PENDING_PER_USER:20}
  submissions-per-minute: ${STUDIO_SUBMISSIONS_PER_MINUTE:10}
  storage-root: ${STORAGE_ROOT:/data}
  cookie-secure: ${COOKIE_SECURE:false}
